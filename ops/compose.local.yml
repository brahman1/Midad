services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: midad
      POSTGRES_USER: midad
      POSTGRES_PASSWORD: midad_local_only
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["midad-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midad"]
      interval: 3s
      timeout: 3s
      retries: 15
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1028:1025", "127.0.0.1:8028:8025"]
volumes:
  midad-db:
